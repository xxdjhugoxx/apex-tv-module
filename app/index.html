<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APEX TV</title>
<!-- ?v= makes the TV's browser cache keep one copy per version; the module build pins these to the release tag. -->
<script>window.APEXTV_PAGE = '1.2.3';</script>
<script>window.APEXTV_API='http://192.168.0.176:8095/';window.APEXTV_LOG='http://192.168.0.176:8095/api/log';window.APEXTV_DISPATCHARR='http://192.168.0.176:9191';</script>
<script src="https://cdn.jsdelivr.net/gh/xxdjhugoxx/apex-tv-module@v1.2.3/app/tvlog.js?v=1.2.3"></script>
<script>window.tvlog || document.write('<script src="tvlog.js?v=1.2.3"><\/script>');</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/xxdjhugoxx/apex-tv-module@v1.2.3/app/app.css?v=1.2.3" onerror="this.onerror=null;this.href='app.css?v=1.2.3'">
</head>
<body>
<!-- Boot screen, styled inline so it shows even if app.css or app.js fail. app.js hides it when channels load. -->
<div id="boot" style="position:fixed;left:0;top:0;right:0;bottom:0;z-index:50;background:#0b0b0f;color:#e6e6ea;font:32px Arial,sans-serif;text-align:center;padding-top:40vh">
  <div style="font-size:64px;font-weight:900;color:#e50914;letter-spacing:3px">APEX<span style="color:#fff;margin-left:10px">TV</span></div>
  <div id="boot-msg" style="margin:28px auto 0;max-width:80%">Loading APEX TV...</div>
</div>
<header id="top">
  <div class="brand">APEX<span>TV</span></div>
  <nav id="tabs">
    <div class="tab" data-tab="live">Live TV</div>
    <div class="tab" data-tab="guide">Guide</div>
    <div class="tab" data-tab="movies">Movies</div>
    <div class="tab" data-tab="series">Series</div>
    <div class="tab" data-tab="library">My Library</div>
    <div class="tab" data-tab="search">Search</div>
    <div class="tab profile" data-tab="profile" id="tab-profile">👤</div>
  </nav>
  <div id="clock"></div>
</header>

<main id="view-browse" class="view">
  <aside id="cats"></aside>
  <div class="main">
    <section id="rows" class="rows"></section>
    <section id="grid" class="grid hidden"></section>
  </div>
</main>

<main id="view-guide" class="view hidden">
  <div id="g-info"><div id="g-title"></div><div id="g-time"></div><div id="g-desc"></div></div>
  <div id="g-head"><div class="g-chhead">OK: watch · 0-9: jump to a channel</div><div id="g-times"></div></div>
  <div id="g-body"></div>
</main>

<main id="view-search" class="view hidden">
  <div class="searchbar"><input id="q" type="text" placeholder="Search channels, movies and series" autocomplete="off" spellcheck="false"></div>
  <section id="srows" class="rows"></section>
</main>

<!-- Movie / series page: opens over the browse view, the player opens over it. -->
<div id="details" class="hidden">
  <div id="d-backdrop"></div>
  <div class="d-shade"></div>
  <div class="dclose">✕</div>
  <div class="d-body">
    <div class="d-top">
      <img id="d-poster" alt="">
      <div class="d-info">
        <h1 id="d-title"></h1>
        <div id="d-meta" class="d-meta"></div>
        <div id="d-plot" class="d-plot"></div>
        <div id="d-credits" class="d-credits"></div>
        <div id="d-btns" class="d-btns"></div>
      </div>
    </div>
    <div id="d-seasons" class="d-seasons hidden"></div>
    <div id="d-eps" class="d-eps hidden"></div>
  </div>
</div>

<div id="player" class="hidden">
  <video id="video" autoplay playsinline></video>
  <div id="osd" class="hidden">
    <div class="osd-row">
      <div class="osd-logo"><img id="osd-logo" alt=""></div>
      <div class="osd-main">
        <div class="osd-name"><span id="osd-num"></span> <span id="osd-name"></span> <span id="osd-fav" class="star hidden">★</span> <span id="osd-q" class="qbadge"></span></div>
        <div class="osd-group" id="osd-group"></div>
        <div class="osd-now" id="osd-now"></div>
        <div class="bar"><i id="osd-bar"></i></div>
        <div class="osd-next" id="osd-next"></div>
        <div class="osd-desc" id="osd-desc"></div>
      </div>
    </div>
    <div class="osd-buttons">
      <div class="btn" data-act="fav" id="btn-fav">★ Favorite</div>
      <div class="btn" data-act="ver" id="btn-ver">Version</div>
      <div class="btn" data-act="list">Channel list</div>
      <div class="hint">▲▼ or 0-9 change channel · OK info · Back list</div>
    </div>
  </div>
  <div id="vosd" class="hidden">
    <div class="v-title" id="v-title"></div>
    <div class="v-sub" id="v-sub"></div>
    <div class="bar v-bar"><i id="v-bar"></i></div>
    <div class="v-times"><span id="v-pos"></span><span id="v-state"></span><span id="v-dur"></span></div>
    <div class="hint">OK pause · ◀▶ 10 s · ▲▼ or ⏪⏩ 1 min · Back to the page</div>
  </div>
  <div id="picker" class="hidden"><h4>Choose version</h4><div id="picker-list"></div></div>
  <div id="status" class="hidden"></div>
</div>

<div id="menu" class="hidden"><h4 id="menu-title"></h4><div id="menu-sub"></div><div id="menu-list"></div></div>
<div id="pin" class="hidden"><h4 id="pin-title"></h4><div id="pin-dots"></div><div id="pin-pad"></div><div id="pin-msg"></div></div>
<div id="numbox" class="hidden"></div>
<div id="toast" class="hidden"></div>

<script src="https://cdn.jsdelivr.net/gh/xxdjhugoxx/apex-tv-module@v1.2.3/app/vendor/mpegts.js?v=1.2.3"></script>
<script>window.mpegts || document.write('<script src="vendor/mpegts.js?v=1.2.3"><\/script>');</script>
<script src="https://cdn.jsdelivr.net/gh/xxdjhugoxx/apex-tv-module@v1.2.3/app/app.js?v=1.2.3"></script>
<script>window.APEXTV_APP || document.write('<script src="app.js?v=1.2.3"><\/script>');</script>
</body>
</html>
